# Base config. Every experiment config inherits from this via `_base_: base.yaml`
# and overrides only what it changes, so a diff between two configs is exactly
# the difference between two experiments.

project:
  name: fracatlas-fracture-detection

seed: 42

paths:
  # Folder that contains (or will contain) the extracted FracAtlas dataset.
  # On Kaggle this is overridden by the FRACDET_DATA_DIR environment variable,
  # e.g. FRACDET_DATA_DIR=/kaggle/input/fracatlas
  data_dir: data/raw
  # Where runs write checkpoints, logs and metrics (gitignored).
  output_dir: outputs

data:
  # Figshare article 22363012, version 7, file FracAtlas.zip (CC BY 4.0).
  source_url: https://ndownloader.figshare.com/files/65518038
  archive_name: FracAtlas.zip
  md5: fe9da2c7c285915ebee69dfdab8fd396
  # Counts of THIS archive (v7, pinned by the md5 above), confirmed on Kaggle 2026-11-03.
  # The paper reports 717 fractured; v7's CSV labels 719. The 2 extra
  # (IMG0003375/6) are labelled fractured, have boxes, and are also left as
  # identical stale copies in Non_fractured/. See docs/phase-0-setup.md.
  expected_num_images: 4083
  expected_num_fractured: 719
